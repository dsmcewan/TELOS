name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, converted_to_draft, reopened]

# Allow the action to read the code, post review feedback on the PR, and
# request an OIDC token (required by claude-code-action for authentication).
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # The pinned code-review command skips draft PRs. Dependabot PRs cannot
    # access this workflow's Actions OAuth secret and the action rejects bot
    # initiators, so leave both cases visibly skipped before starting the job.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # SECURITY: `plugin_marketplaces` as a git URL has NO supported pinning
      # syntax (the action's MARKETPLACE_URL_REGEX requires the string to end
      # in literal ".git", so `#<sha>`/`@<ref>` suffixes are rejected) — a bare
      # URL always resolves the plugin from the marketplace repo's LIVE
      # default-branch HEAD. That is unacceptable in a job that holds
      # `pull-requests: write` + `id-token: write` and the OAuth secret: a
      # compromised or force-pushed upstream branch would run arbitrary
      # plugin code here. Fix: check out the marketplace source ourselves at
      # a pinned, human-reviewed commit, then hand claude-code-action a local
      # filesystem path — its isLocalPath() check accepts paths starting with
      # "/", "./", "../", so plugin resolution is content-pinned instead of
      # live-HEAD.
      - name: Checkout pinned plugin marketplace (anthropics/claude-code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-code
          # v2.1.278 — contains plugins/code-review and marketplace name
          # claude-code-plugins. Bump deliberately after reviewing the diff.
          ref: bf7d404e26a5fb6167d21b46c93a2bf6c22ab274
          path: .ci/claude-code-marketplace
          persist-credentials: false

      # The marketplace name 'claude-code-plugins' is RESERVED for anthropics-org GitHub
      # sources — a local (pinned) checkout may not claim it (first live run failed on
      # exactly this, 2026-09-20). Rename the pinned copy's marketplace; content remains
      # the SHA-pinned official plugin, only the label changes.
      - name: Rename pinned marketplace (reserved-name rule for local sources)
        run: |
          python3 - <<'PY'
          import json
          p = '.ci/claude-code-marketplace/.claude-plugin/marketplace.json'
          m = json.load(open(p))
          assert m.get('name') == 'claude-code-plugins', f"unexpected marketplace name: {m.get('name')!r}"
          m['name'] = 'telos-pinned-plugins'
          json.dump(m, open(p, 'w'), indent=2)
          print('marketplace renamed -> telos-pinned-plugins')
          PY

      - name: Automated Claude review
        uses: anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7 # v1.0.207
        with:
          # Authenticate with the Claude subscription (Max), NOT metered API credits.
          # Mint with `claude setup-token` and store as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          # The token is long-lived but NOT eternal — when it lapses this check fails fast
          # (~15s, is_error with no findings), which looks identical to an exhausted balance.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Install the code-review plugin from the pinned local checkout above
          # (not a live-HEAD URL — see the checkout step's comment).
          plugin_marketplaces: "${{ github.workspace }}/.ci/claude-code-marketplace"
          plugins: "code-review@telos-pinned-plugins"
          # --comment POSTS findings as inline PR comments. Without it the review still runs
          # (minutes, real cost) and then DISCARDS its conclusion: `show_full_output` is false
          # (and must stay false — this repo is public and those logs are world-readable), so an
          # unposted finding is unrecoverable. The check then means only "the reviewer did not
          # crash", never "the code is fine". A review that cannot report is not an audit.
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
