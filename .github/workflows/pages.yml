# Deploys demo/ to GitHub Pages. `enablement: true` creates the Pages site on
# first run (works on public repos — same pattern as the Convergence demo).
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload demo directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
